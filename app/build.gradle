plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'ru.holly.script'
    compileSdk 33

    defaultConfig {
        applicationId "ru.holly.script"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
